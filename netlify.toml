[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/en/"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/publication/:slug/"
  to = "/research/:slug/"
  status = 301

[[redirects]]
  from = "/en/post/undergraduate-research-opportunity/"
  to = "/opportunities/"
  status = 301

[[redirects]]
  from = "/en/project/reading-list/"
  to = "/reading-list/"
  status = 301

[[redirects]]
  from = "/en/publication/"
  to = "/#publications"
  status = 301

[[redirects]]
  from = "/en/post/"
  to = "/posts/"
  status = 301
